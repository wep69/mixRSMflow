name: pkgdown
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  pkgdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown
          needs: check
      - name: Install package from source
        shell: Rscript {0}
        run: install.packages(".", repos = NULL, type = "source")
      - name: Verify package installation
        shell: Rscript {0}
        run: |
          cat("installed:", requireNamespace("mixRSMflow"), "\n")
          cat("lib paths:", paste(.libPaths(), collapse = "; "), "\n")
          md_dir <- system.file("monographs", package = "mixRSMflow")
          cat("monographs dir:", md_dir, "\n")
          if (nzchar(md_dir)) cat("files:", paste(list.files(md_dir), collapse = ", "), "\n")
      - name: Build site locally in CI
        shell: Rscript {0}
        run: |
          lib <- dirname(system.file("DESCRIPTION", package = "mixRSMflow"))
          if (nzchar(lib)) Sys.setenv(R_LIBS = dirname(lib))
          pkgdown::build_site_github_pages(new_process = FALSE, install = TRUE, dest_dir = "_site")
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
